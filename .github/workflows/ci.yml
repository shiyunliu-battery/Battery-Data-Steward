name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src
      - name: Dependency audit
        run: python -m pip_audit .
      - name: Run tests
        run: python -m pytest --cov=battery_data_steward --cov-report=term-missing
      - name: Build package
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Install wheel smoke test
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python -m pip install dist/*.whl
          python -c "from importlib.metadata import version; import bds, battery_data_steward; assert version('battery-data-steward') == bds.__version__ == battery_data_steward.__version__; assert bds.read is battery_data_steward.read; print(bds.__version__)"
          python -m battery_data_steward --version
          python -m battery_data_steward.cli --version
          python -c "from importlib.metadata import distribution; from importlib.resources import files; dist = distribution('battery-data-steward'); assert set(dist.read_text('top_level.txt').split()) == {'battery_data_steward', 'bds'}; assert all(files(name).joinpath('py.typed').is_file() for name in ('battery_data_steward', 'bds'))"
          bds --version
          bds inspect-schema
